name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Tests must pass with no secrets configured. The suite fakes every
      # external call, so a failure here is a real failure — not a missing key.
      - name: Test
        run: uv run pytest -q

      - name: Check the app boots and degrades cleanly with no keys or data
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          health = TestClient(app).get('/health').json()
          assert health['status'] == 'ok'
          assert health['grid']['cells'] > 1000
          print('boot ok:', health['grid']['cells'], 'cells, provider:', health['provider'])
          "

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch backend/.env frontend/.env 2>/dev/null; then
            echo "::error::A .env file is tracked by git. Remove it and rotate the keys."
            exit 1
          fi
          echo "No tracked .env files."
