[project]
name = "navara-backend"
version = "0.1.0"
description = "NAVARA — safest-route scoring engine with a news-signal agent, for Delhi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",

    # --- Agent ---
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0",

    # --- Data / ingest ---
    "numpy>=1.26",
    "pandas>=2.2",
    "shapely>=2.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
# Raster handling for the VIIRS night-lights ingest. Split out because rasterio
# pulls a large GDAL stack that most contributors never need — only whoever
# rebuilds the NTLS layer does.
raster = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
